<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Agenda Relay helps you review scheduling requests, calendar availability, and consented booking links.">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Agenda Relay{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=static_asset_versions.get('favicon.svg', '')) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=static_asset_versions.get('app.css', '')) }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
</body>
</html>
