[project]
name = "agenda-relay"
version = "1.0.0"
description = "Privacy-conscious WhatsApp-assisted scheduling with Google Calendar; optional WhatsApp Business Cloud API integration"
requires-python = ">=3.11,<3.16"
license = { text = "Proprietary" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["scheduler"]
omit = ["scheduler/templates/*", "scheduler/static/*"]
