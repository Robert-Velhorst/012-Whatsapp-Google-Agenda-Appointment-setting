name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pip-audit==2.9.0
      - run: pip-audit -r requirements.lock
      - run: python -m compileall -q scheduler run.py
      - run: pytest -q
      - run: docker build -t agenda-relay:test .
