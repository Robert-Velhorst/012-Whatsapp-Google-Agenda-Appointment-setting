name: CI
on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install -r requirements.txt pip-audit==2.10.1
      - run: pip-audit
      - run: python -m compileall -q scheduler run.py
      - run: pytest -q
      - run: touch .env
      - run: docker compose config --no-env-resolution --quiet
      - run: docker compose config --no-env-resolution --format json | python -c "import json,sys; assert json.load(sys.stdin)['services']['worker']['healthcheck']['disable'] is True"
      - run: docker build -t agenda-relay:test .
