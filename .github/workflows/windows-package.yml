name: Windows package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-package.yml"
      - "agenda-relay.spec"
      - "pyproject.toml"
      - "requirements*.txt"
      - "requirements*.lock"
      - "tools/**"
      - "run.py"
      - "scheduler/**"
      - "tests/**"
      - "windows/**"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.1"
          freethreaded: true
          cache: pip
      - run: python tools/prepare_sqlite_runtime.py
      - shell: pwsh
        run: |
          $runtime = Get-Content .runtime/sqlite-runtime.json -Raw | ConvertFrom-Json
          if (-not $runtime.free_threaded_build) { throw 'The Windows CI target must retain free-threaded Python.' }
          & $runtime.executable -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements-build.lock
      - run: .\.venv\Scripts\python.exe -m pip install pip-audit==2.10.1
      - run: .\.venv\Scripts\python.exe -m pip_audit
      - run: .\.venv\Scripts\python.exe -m pip_audit -r requirements-build.lock --no-deps --disable-pip --strict
      - run: .\.venv\Scripts\python.exe -m pytest -q
      - shell: powershell
        run: .\windows\Test-AgendaRelay.Runtime.ps1
      - shell: powershell
        run: .\windows\Build-Windows.ps1
      - shell: powershell
        run: |
          $packageReport = .\windows\Test-Package.ps1 | Select-Object -Last 1 | ConvertFrom-Json
          if (-not $packageReport.health -or $packageReport.runtime.sqlite -ne '3.54.1') { throw 'Packaged runtime evidence is incomplete.' }
          $packageReport | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 package-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AgendaRelay-Windows-x64
          path: |
            dist/AgendaRelay-Windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-runtime-verification
          include-hidden-files: true
          path: |
            .runtime/sqlite-runtime.json
            package-verification.json
          if-no-files-found: error
